# ECS Fargate task — replace ACCOUNT_ID and REGION

family: behalf
networkMode: awsvpc
requiresCompatibilities:
  - FARGATE
cpu: "512"
memory: "1024"
executionRoleArn: arn:aws:iam::ACCOUNT_ID:role/ecsTaskExecutionRole
containerDefinitions:
  - name: behalf
    image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/behalf:latest
    essential: true
    portMappings:
      - containerPort: 3000
        protocol: tcp
    environment:
      - name: NODE_ENV
        value: "production"
      - name: PORT
        value: "3000"
      - name: HOSTNAME
        value: "0.0.0.0"
    logConfiguration:
      logDriver: awslogs
      options:
        awslogs-group: /ecs/behalf
        awslogs-region: REGION
        awslogs-stream-prefix: ecs
