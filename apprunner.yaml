# AWS App Runner — simplest container host
# Port must be 3000 for this Next.js image.

version: 1.0
runtime: docker

build:
  commands:
    build:
      - echo "Building Behalf (Next.js)"
      - docker build -t behalf .

run:
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "3000"
    - name: HOSTNAME
      value: "0.0.0.0"
